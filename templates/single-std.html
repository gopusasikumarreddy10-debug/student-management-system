
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile</title>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: #f7f6fc;
            color: #29243b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        /* Main Card */

        .profile-card {
            width: 100%;
            max-width: 550px;
            background: white;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #eeeaf7;
            box-shadow: 0 8px 25px rgba(65, 45, 120, 0.06);
        }

        /* Header */

        .profile-header {
            background: #7554d8;
            padding: 35px 25px;
            text-align: center;
            color: white;
        }

        .profile-img {
            width: 115px;
            height: 115px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid white;
            margin-bottom: 15px;
        }

        .profile-header h2 {
            font-size: 23px;
            font-weight: 700;
        }

        .profile-header p {
            font-size: 13px;
            color: #e9e1ff;
            margin-top: 6px;
        }

        /* Details Section */

        .details {
            padding: 28px 32px;
        }

        .section-title {
            font-size: 18px;
            color: #30264b;
            margin-bottom: 18px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #f0edf6;
            gap: 15px;
        }

        .detail-row:last-of-type {
            border-bottom: none;
        }

        .detail-label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #89849b;
            font-size: 13px;
        }

        .detail-label i {
            color: #7554d8;
            width: 17px;
            text-align: center;
        }

        .detail-value {
            color: #30264b;
            font-size: 13px;
            font-weight: 600;
            text-align: right;
            overflow-wrap: anywhere;
        }

        /* Attendance */

        .attendance {
            background: #faf9fe;
            padding: 17px;
            border-radius: 9px;
            margin-top: 20px;
        }

        .attendance h3 {
            font-size: 14px;
            color: #30264b;
            margin-bottom: 12px;
        }

        .status {
            display: inline-block;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .present {
            background: #e8f8ef;
            color: #26976b;
        }

        .absent {
            background: #fff0f0;
            color: #dc5555;
        }

        /* Footer */

        .footer {
            padding: 20px 32px;
            background: #faf9fe;
            border-top: 1px solid #eeeaf7;
        }

        .home-btn {
            display: block;
            text-align: center;
            text-decoration: none;
            background: #7554d8;
            color: white;
            padding: 12px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 600;
            transition: 0.3s;
        }

        .home-btn:hover {
            background: #6040bd;
        }

        /* Responsive */

        @media(max-width: 500px) {

            body {
                padding: 15px;
            }

            .details {
                padding: 23px 20px;
            }

            .profile-header {
                padding: 28px 20px;
            }

            .footer {
                padding: 18px 20px;
            }

            .profile-header h2 {
                font-size: 20px;
            }

        }

    </style>
</head>

<body>

    <div class="profile-card">

        <!-- Profile Header -->

        <div class="profile-header">

            <img src="{{ std[6] }}"
                 alt="Student Image"
                 class="profile-img">

            <h2>{{ std[1] }}</h2>

            <p>Student Profile</p>

        </div>


        <!-- Personal Information -->

        <div class="details">

            <h3 class="section-title">
                Personal Information
            </h3>


            <div class="detail-row">

                <div class="detail-label">
                    <i class="fa-solid fa-user"></i>
                    Student Name
                </div>

                <div class="detail-value">
                    {{ std[1] }}
                </div>

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    <i class="fa-solid fa-calendar"></i>
                    Age
                </div>

                <div class="detail-value">
                    {{ std[2] }}
                </div>

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    <i class="fa-solid fa-venus-mars"></i>
                    Gender
                </div>

                <div class="detail-value">
                    {{ std[3] }}
                </div>

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    <i class="fa-solid fa-star"></i>
                    Marks
                </div>

                <div class="detail-value">
                    {{ std[4] }} / 100
                </div>

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    <i class="fa-solid fa-book-open"></i>
                    Course
                </div>

                <div class="detail-value">
                    {{ std[5] }}
                </div>

            </div>


            <!-- Attendance -->

            <div class="attendance">

                <h3>
                    <i class="fa-solid fa-clipboard-check"></i>
                    Attendance Status
                </h3>

                {% if std[7] %}

                    <span class="status present">
                        <i class="fa-solid fa-circle-check"></i>
                        Present
                    </span>

                {% else %}

                    <span class="status absent">
                        <i class="fa-solid fa-circle-xmark"></i>
                        Absent
                    </span>

                {% endif %}

            </div>

        </div>


        <!-- Footer -->

        <div class="footer">

            <a href="/" class="home-btn">
                <i class="fa-solid fa-arrow-left"></i>
                Back to Students
            </a>

        </div>

    </div>

</body>
</html>

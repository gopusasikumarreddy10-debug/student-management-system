
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background: #f7f6fc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            color: #39334f;
        }
        .form-container {
            width: 100%;
            max-width: 540px;
            background: #ffffff;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #ebe8f5;
            box-shadow: 0 5px 25px rgba(50, 40, 90, 0.09);
        }
        .form-header {
            background: #7554d8;
            padding: 27px 25px;
            text-align: center;
            color: white;
        }
        .form-header i {
            font-size: 30px;
            margin-bottom: 12px;
            color: #eee9ff;
        }
        .form-header h1 {
            font-size: 24px;
            font-weight: 650;
        }
        .form-header p {
            color: #eee9ff;
            font-size: 14px;
            margin-top: 7px;
        }
        .form-body {
            padding: 28px 32px 32px;
        }
        .section-title {
            color: #514078;
            font-size: 17px;
            font-weight: 650;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title i {
            color: #7554d8;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            color: #514a65;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd8eb;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
            color: #39334f;
            background: white;
            transition: 0.3s;
        }
        input:focus, select:focus {
            border-color: #7554d8;
            box-shadow: 0 0 0 3px rgba(117, 84, 216, 0.12);
        }
        input::placeholder {
            color: #aaa4bb;
        }
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            padding-top: 22px;
            border-top: 1px solid #eeeaf5;
        }
        button, .back-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 9px;
            transition: 0.3s;
        }
        button {
            background: #7554d8;
            color: white;
        }
        button:hover {
            background: #6241c2;
            transform: translateY(-2px);
        }
        .back-btn {
            background: #eeeaf8;
            color: #5c4b85;
        }
        .back-btn:hover {
            background: #e1daf3;
            transform: translateY(-2px);
        }
        @media(max-width: 480px) {
            body {
                padding: 15px;
            }
            .form-header {
                padding: 23px 18px;
            }
            .form-header h1 {
                font-size: 21px;
            }
            .form-body {
                padding: 23px 20px;
            }
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <i class="fa-solid fa-user-plus"></i>
            <h1>Add New Student</h1>
            <p>Enter student information below</p>
        </div>
        <div class="form-body">
            <h3 class="section-title">
                <i class="fa-solid fa-user-pen"></i>
                Student Information
            </h3>
            <form action="/add-student" method="post">
                <div class="form-group">
                    <label>Name</label>
                    <input
                        type="text"
                        name="name"
                        placeholder="Enter student name"
                        required>
                </div>
                <div class="form-group">
                    <label>Age (18-60)</label>
                    <input
                        type="number"
                        name="age"
                        min="18"
                        max="60"
                        placeholder="Enter age"
                        required>
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Marks (1-100)</label>
                    <input
                        type="number"
                        name="marks"
                        min="1"
                        max="100"
                        placeholder="Enter marks"
                        required>
                </div>
                <div class="form-group">
                    <label>Course</label>
                    <input
                        type="text"
                        name="course"
                        placeholder="Enter course name"
                        required>
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input
                        type="url"
                        name="image"
                        placeholder="Paste student image URL">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select name="status" required>
                        <option value="">Select Status</option>
                        <option value="1">Present</option>
                        <option value="0">Absent</option>
                    </select>
                </div>
                <div class="button-group">
                    <a href="/" class="back-btn">
                        <i class="fa-solid fa-arrow-left"></i>
                        Back
                    </a>
                    <button type="submit">
                        <i class="fa-solid fa-user-plus"></i>
                        Add Student
                    </button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
